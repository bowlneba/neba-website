name: Main Branch Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        required: true
        options:
          - Production

jobs:
  ci:
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      is_pull_request: false
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  cd:
    needs: ci
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    secrets: inherit