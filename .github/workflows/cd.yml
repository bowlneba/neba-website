name: Continuous Deployment

# Deploys the whole stack to production with `aspire deploy`: provision, seed Key Vault,
# run the migration jobs, then deploy api and web. A read-only what-if runs first and stops
# the deploy if it would create or delete Postgres or the storage account.
#
# Keep the deploy settings in step with hotfix.yml and staging.yml.

on:
  workflow_call:

# ImageSharp needs a Six Labors license in Release builds (see Directory.Build.props).
env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  deploy:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: Production
    # A hung deploy would hold the prod-deploy queue for the six-hour default.
    timeout-minutes: 60
    # Same group as hotfix.yml's deploy job, so a main deploy and a hotfix queue.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Login to Azure
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Install Aspire CLI
        run: |
          set -euo pipefail
          aspire_version="$(.github/scripts/aspire-version.sh)"
          curl -sSL --fail --proto '=https' --tlsv1.2 https://aspire.dev/install.sh -o install-aspire.sh
          [ -s install-aspire.sh ]
          bash install-aspire.sh --version "$aspire_version"
          rm -f install-aspire.sh
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      # Stops the deploy if it would create or delete the database or storage account (a wrong
      # resource group or a renamed resource would do that). Reads Azure only.
      - name: What-if guard
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__webCustomDomain: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          Parameters__webCertificateName: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          Parameters__webWwwCustomDomain: ${{ vars.AZURE_WEB_WWW_CUSTOM_DOMAIN }}
          Parameters__webWwwCertificateName: ${{ vars.AZURE_WEB_WWW_CERTIFICATE_NAME }}
          Parameters__apiCustomDomain: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          Parameters__apiCertificateName: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
        run: .github/scripts/whatif-guard.sh

      # Migrations__Run registers the run-migrations step, which starts the two migration jobs
      # after their images deploy and before api and web deploy (see MigrationPipelineStep.cs).
      # The resource group must already exist: production never creates it.
      - name: Deploy
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Azure__AllowResourceGroupCreation: "false"
          Migrations__Run: "true"
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__webCustomDomain: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          Parameters__webCertificateName: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          Parameters__webWwwCustomDomain: ${{ vars.AZURE_WEB_WWW_CUSTOM_DOMAIN }}
          Parameters__webWwwCertificateName: ${{ vars.AZURE_WEB_WWW_CERTIFICATE_NAME }}
          Parameters__apiCustomDomain: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          Parameters__apiCertificateName: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
          Parameters__googlePrivateKey: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          Parameters__googlePrivateKeyId: ${{ secrets.GOOGLE_PRIVATE_KEY_ID }}
          Parameters__googleClientEmail: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          Parameters__emailAppPassword: ${{ secrets.GOOGLE_PASSWORD }}
          Parameters__jwtSigningKey: ${{ secrets.JWT_SIGNING_KEY }}
          Parameters__legacyApiKey: ${{ secrets.LEGACY_API_KEY }}
          Parameters__legacyConnectionString: ${{ secrets.LEGACY_DB_CONNECTION_STRING }}
          Parameters__discordApiLogsWebhookUrl: ${{ secrets.DISCORD_API_LOGS_WEBHOOK_URL }}
          Parameters__discordManualInterventionWebhookUrl: ${{ secrets.DISCORD_MANUAL_INTERVENTION_WEBHOOK_URL }}
          Parameters__discordNewsWebhookUrl: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: aspire deploy --environment production --non-interactive --include-exception-details

      # Container Apps run in single-revision mode, so a new revision takes traffic only
      # once it passes its readiness probe. This step confirms the live site afterward.
      - name: Smoke test
        env:
          AZURE_API_CUSTOM_DOMAIN: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          AZURE_WEB_CUSTOM_DOMAIN: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --max-time 10 "$url" > /dev/null; then
                echo "OK: $url"
                return 0
              fi
              echo "Waiting for $url (attempt $attempt)..."
              sleep 5
            done
            echo "::error::Smoke test failed: $url"
            return 1
          }
          check "https://${AZURE_API_CUSTOM_DOMAIN}/health"
          check "https://${AZURE_WEB_CUSTOM_DOMAIN}/health"
