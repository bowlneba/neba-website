name: Staging Deploy

# Deploys the whole stack with `aspire deploy` into its own resource group in the production
# subscription. It exists to prove the deploy pipeline (provisioning, secrets, migration jobs,
# api and web) before production moves off azd. Manual only. The app does not need to work.
# Setup notes live in docs/plans/aspire-17.md (B1). Staging runs in westus2 (Staging AZURE_LOCATION).

on:
  workflow_dispatch:
  # Temporary: GitHub cannot dispatch a workflow that exists only on a feature branch, so a push
  # to this branch that changes this file starts a run. Remove with the Part B cutover.
  push:
    branches: [aspire-deploy]
    paths: [.github/workflows/staging.yml]

concurrency:
  group: staging-deploy
  cancel-in-progress: false

# ImageSharp needs a Six Labors license in Release builds (see Directory.Build.props).
env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: Staging
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Check staging settings
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
          AZURE_POSTGRES_SKU_NAME: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          AZURE_POSTGRES_SKU_TIER: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          AZURE_CONTAINERAPP_MIN_REPLICAS: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          AZURE_CONTAINERAPP_MAX_REPLICAS: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          AZURE_CONTAINERAPP_CONCURRENT_REQUESTS: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
        run: |
          set -euo pipefail

          for name in AZURE_RESOURCE_GROUP AZURE_SUBSCRIPTION_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_LOCATION \
            AZURE_PRINCIPAL_ID AZURE_POSTGRES_SKU_NAME AZURE_POSTGRES_SKU_TIER \
            AZURE_CONTAINERAPP_MIN_REPLICAS AZURE_CONTAINERAPP_MAX_REPLICAS AZURE_CONTAINERAPP_CONCURRENT_REQUESTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Variable $name is not set for the Staging environment"
              exit 1
            fi
          done

          # Production lives in rg-bowlneba-prod in this subscription. A staging run must never
          # target it, whatever the variable says.
          if [[ "$AZURE_RESOURCE_GROUP" != *staging* ]]; then
            echo "::error::AZURE_RESOURCE_GROUP '$AZURE_RESOURCE_GROUP' must contain 'staging'"
            exit 1
          fi

      - name: Login to Azure
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Install Aspire CLI
        run: |
          set -euo pipefail
          aspire_version="$(.github/scripts/aspire-version.sh)"
          curl -sSL --fail --proto '=https' --tlsv1.2 https://aspire.dev/install.sh -o install-aspire.sh
          [ -s install-aspire.sh ]
          bash install-aspire.sh --version "$aspire_version"
          rm -f install-aspire.sh
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      # Custom domains are left unset on purpose: staging has no DNS, and the AppHost skips a
      # domain whose parameter is empty. Migrations__Run is what lets the run-migrations step
      # start the migration jobs (see MigrationPipelineStep.cs).
      - name: Deploy
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Azure__AllowResourceGroupCreation: "true"
          Migrations__Run: "true"
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__googlePrivateKey: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          Parameters__googlePrivateKeyId: ${{ secrets.GOOGLE_PRIVATE_KEY_ID }}
          Parameters__googleClientEmail: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          Parameters__emailAppPassword: ${{ secrets.GOOGLE_PASSWORD }}
          Parameters__jwtSigningKey: ${{ secrets.JWT_SIGNING_KEY }}
          Parameters__legacyApiKey: ${{ secrets.LEGACY_API_KEY }}
          Parameters__legacyConnectionString: ${{ secrets.LEGACY_DB_CONNECTION_STRING }}
          Parameters__discordApiLogsWebhookUrl: ${{ secrets.DISCORD_API_LOGS_WEBHOOK_URL }}
          Parameters__discordManualInterventionWebhookUrl: ${{ secrets.DISCORD_MANUAL_INTERVENTION_WEBHOOK_URL }}
          Parameters__discordNewsWebhookUrl: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          date -u +"Deploy started %H:%M:%S UTC"
          aspire deploy --environment staging --non-interactive --include-exception-details
          date -u +"Deploy finished %H:%M:%S UTC"

      # The OIDC token from the first login lasts about 5 minutes, so log in again before the
      # listing. Also a data point for how long the deploy takes (see the Deploy step's times).
      - name: Re-login to Azure
        if: always()
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      # Lists what the run created, to compare names and types with production.
      - name: List staging resources
        if: always()
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: az resource list --resource-group "$AZURE_RESOURCE_GROUP" --query "[].{name:name, type:type}" --output table
