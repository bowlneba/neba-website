name: Hotfix Workflow

# Emergency fast path: tests, then deploy api + web only. Run it by hand on a
# `hotfix/*` branch cut from the latest release tag (the commit production runs;
# tags are added by hand after each deploy).
#
# It deploys api and web only and never runs migrations (Migrations__Run is left unset, so the
# migration step is not registered). `aspire do` also re-applies the infrastructure the two apps
# depend on, from the hotfix branch's own Bicep, and rewrites the Key Vault secrets with the same
# GitHub secret values. A read-only what-if runs first and stops the deploy if it would create or
# delete Postgres or the storage account. Open the PR from the hotfix branch to `main` right
# after you start this run so the full pipeline checks the same change in parallel.
# See docs/learnings/hotfix.md.
#
# Keep the deploy settings in step with cd.yml and staging.yml.

on:
  workflow_dispatch:
    inputs:
      base_tag:
        description: "Tag production runs. Blank = latest v* tag"
        type: string
        default: ""
      allow_migrations:
        description: "Allow a diff that touches EF migrations (migrations are NOT run by this workflow)"
        type: boolean
        default: false

permissions:
  contents: read

# ImageSharp needs a Six Labors license in Release builds (see Directory.Build.props).
env:
  SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require a hotfix branch
        if: ${{ !startsWith(github.ref, 'refs/heads/hotfix/') }}
        run: |
          echo "::error::Run this workflow on a hotfix/* branch (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve the production tag
        id: base
        env:
          INPUT_TAG: ${{ inputs.base_tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$(git tag --list 'v*' --sort=-v:refname | head -1)}"
          if [ -z "$tag" ] || ! git rev-parse --verify --quiet "refs/tags/$tag" > /dev/null; then
            echo "::error::No production tag found ('$tag'). Tag the deployed commit, or pass base_tag."
            exit 1
          fi
          echo "Production tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require the production tag as an ancestor
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_TAG" HEAD; then
            echo "::error::$BASE_TAG is not an ancestor of this branch. Cut the hotfix from that tag, or this deploy would drop code production already runs."
            exit 1
          fi

      - name: Require a version bump
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: .github/scripts/check-version-bump.sh --tag "$BASE_TAG"

      - name: Block migrations
        if: ${{ !inputs.allow_migrations }}
        env:
          BASE_TAG: ${{ steps.base.outputs.tag }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_TAG"...HEAD | grep -i 'migrations' || true)"
          if [ -n "$changed" ]; then
            echo "::error::This diff touches migrations, which this workflow does not run. Use the normal pipeline, or re-run with allow_migrations after a plan for the schema."
            echo "$changed"
            exit 1
          fi

  test-dotnet:
    name: ${{ matrix.test-name }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
    strategy:
      fail-fast: true
      matrix:
        include:
          - test-project: tests/Neba.Website.Tests/Neba.Website.Tests.csproj
            test-name: Website Tests
            needs-integration: false
          - test-project: tests/Neba.Api.Tests/Neba.Api.Tests.csproj
            test-name: API Tests
            needs-integration: true

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pre-pull test container images
        if: matrix.needs-integration
        run: |
          docker pull postgres:17.6
          docker pull mcr.microsoft.com/azure-storage/azurite:latest

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet run --project ${{ matrix.test-project }} --configuration Release --no-build

  test-js:
    name: JavaScript Tests (Jest)
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest tests
        run: npm test

  deploy:
    name: Deploy api and web
    needs: [guard, test-dotnet, test-js]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    # Same group as cd.yml's deploy job, so a main deploy and a hotfix queue.
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Login to Azure
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Install Aspire CLI
        run: |
          set -euo pipefail
          aspire_version="$(.github/scripts/aspire-version.sh)"
          curl -sSL --fail --proto '=https' --tlsv1.2 https://aspire.dev/install.sh -o install-aspire.sh
          [ -s install-aspire.sh ]
          bash install-aspire.sh --version "$aspire_version"
          rm -f install-aspire.sh
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      # A bad key would otherwise fail only when the new api starts.
      - name: Check the bowler PII hash key
        env:
          BOWLER_PII_HASH_KEY: ${{ secrets.BOWLER_PII_HASH_KEY }}
        run: .github/scripts/check-hash-key.sh

      - name: What-if guard
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__webCustomDomain: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          Parameters__webCertificateName: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          Parameters__webWwwCustomDomain: ${{ vars.AZURE_WEB_WWW_CUSTOM_DOMAIN }}
          Parameters__webWwwCertificateName: ${{ vars.AZURE_WEB_WWW_CERTIFICATE_NAME }}
          Parameters__apiCustomDomain: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          Parameters__apiCertificateName: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
        run: .github/scripts/whatif-guard.sh

      # `aspire do` runs one step per call. Migrations__Run is deliberately not set, so the
      # run-migrations step does not exist. The log check fails the run if that ever changes.
      - name: Deploy api and web
        env:
          Azure__SubscriptionId: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          Azure__TenantId: ${{ vars.AZURE_TENANT_ID }}
          Azure__Location: ${{ vars.AZURE_LOCATION }}
          Azure__ResourceGroup: ${{ vars.AZURE_RESOURCE_GROUP }}
          Azure__AllowResourceGroupCreation: "false"
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__webCustomDomain: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          Parameters__webCertificateName: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          Parameters__webWwwCustomDomain: ${{ vars.AZURE_WEB_WWW_CUSTOM_DOMAIN }}
          Parameters__webWwwCertificateName: ${{ vars.AZURE_WEB_WWW_CERTIFICATE_NAME }}
          Parameters__apiCustomDomain: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          Parameters__apiCertificateName: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
          Parameters__googlePrivateKey: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          Parameters__googlePrivateKeyId: ${{ secrets.GOOGLE_PRIVATE_KEY_ID }}
          Parameters__googleClientEmail: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          Parameters__emailAppPassword: ${{ secrets.GOOGLE_PASSWORD }}
          Parameters__jwtSigningKey: ${{ secrets.JWT_SIGNING_KEY }}
          Parameters__legacyApiKey: ${{ secrets.LEGACY_API_KEY }}
          Parameters__legacyConnectionString: ${{ secrets.LEGACY_DB_CONNECTION_STRING }}
          Parameters__discordApiLogsWebhookUrl: ${{ secrets.DISCORD_API_LOGS_WEBHOOK_URL }}
          Parameters__discordManualInterventionWebhookUrl: ${{ secrets.DISCORD_MANUAL_INTERVENTION_WEBHOOK_URL }}
          Parameters__discordNewsWebhookUrl: ${{ secrets.DISCORD_NEWS_WEBHOOK_URL }}
          Parameters__bowlerPiiHashKey: ${{ secrets.BOWLER_PII_HASH_KEY }}
          Parameters__legacySsnPassphrase: ${{ secrets.LEGACY_SSN_PASSPHRASE }}
        run: |
          set -euo pipefail
          for step in provision-api-containerapp provision-web-containerapp; do
            aspire do "$step" --environment production --non-interactive --include-exception-details 2>&1 | tee -a hotfix-deploy.log
          done

          if grep -q "run-migrations" hotfix-deploy.log; then
            echo "::error::A hotfix run reached the migration step"
            exit 1
          fi
          for step in provision-api-containerapp provision-web-containerapp; do
            if ! grep -q "$step completed successfully" hotfix-deploy.log; then
              echo "::error::$step did not complete"
              exit 1
            fi
          done

      # Container Apps run in single-revision mode, so a new revision takes traffic only
      # once it passes its readiness probe. This step confirms the live site afterward.
      - name: Smoke test
        env:
          AZURE_API_CUSTOM_DOMAIN: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          AZURE_WEB_CUSTOM_DOMAIN: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            for attempt in $(seq 1 24); do
              if curl --fail --silent --show-error --max-time 10 "$url" > /dev/null; then
                echo "OK: $url"
                return 0
              fi
              echo "Waiting for $url (attempt $attempt)..."
              sleep 5
            done
            echo "::error::Smoke test failed: $url"
            return 1
          }
          check "https://${AZURE_API_CUSTOM_DOMAIN}/health"
          check "https://${AZURE_WEB_CUSTOM_DOMAIN}/health"
