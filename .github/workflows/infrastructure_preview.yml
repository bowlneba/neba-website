name: Infrastructure Preview

# Read-only what-if of the production infrastructure for an AppHost change. It reads Azure and
# changes nothing, and fails if the deploy would create or delete Postgres or the storage
# account. Pull requests call it and post the result as a comment. The deploy job in cd.yml
# runs the same check itself, right before it deploys.
#
# It runs without a GitHub environment, so every value comes from repository variables (the
# Production environment's values are not visible here). See docs/learnings/aspire-deploy-cutover.md.

on:
  workflow_call:
    inputs:
      artifact_name:
        description: Artifact name for the what-if summary
        required: false
        default: infra-whatif
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing the what-if summary
        value: ${{ jobs.preview.outputs.artifact-name }}

jobs:
  preview:
    name: Infrastructure Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Login to Azure
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Install Aspire CLI
        run: |
          set -euo pipefail
          aspire_version="$(.github/scripts/aspire-version.sh)"
          curl -sSL --fail --proto '=https' --tlsv1.2 https://aspire.dev/install.sh -o install-aspire.sh
          [ -s install-aspire.sh ]
          bash install-aspire.sh --version "$aspire_version"
          rm -f install-aspire.sh
          echo "$HOME/.aspire/bin" >> "$GITHUB_PATH"

      - name: What-if
        env:
          OUTPUT_DIR: whatif-output
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
          Parameters__postgresSkuName: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          Parameters__postgresSkuTier: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          Parameters__deployPrincipalId: ${{ vars.AZURE_PRINCIPAL_ID }}
          Parameters__minReplicas: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          Parameters__maxReplicas: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          Parameters__concurrentRequests: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          Parameters__webCustomDomain: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          Parameters__webCertificateName: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          Parameters__webWwwCustomDomain: ${{ vars.AZURE_WEB_WWW_CUSTOM_DOMAIN }}
          Parameters__webWwwCertificateName: ${{ vars.AZURE_WEB_WWW_CERTIFICATE_NAME }}
          Parameters__apiCustomDomain: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          Parameters__apiCertificateName: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
        run: .github/scripts/whatif-guard.sh

      - name: Set artifact metadata
        id: meta
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload what-if artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            whatif-output/whatif-summary.md
            whatif-output/whatif.json
          if-no-files-found: ignore
          retention-days: 7
