name: Infrastructure Preview

on:
  workflow_call:
    inputs:
      azure_env_name:
        description: Azure Developer CLI environment name
        required: true
        type: string
      azure_location:
        description: Azure location for environment initialization
        required: true
        type: string
      artifact_name:
        description: Artifact name for the preview output
        required: false
        default: azd-preview
        type: string
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing preview output
        value: ${{ jobs.preview.outputs.artifact-name }}

jobs:
  preview:
    name: Infrastructure Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - uses: actions/checkout@v7

      - name: Login to Azure
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3
        with:
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          client-id: ${{ vars.AZURE_CLIENT_ID }}

      - name: Setup azd
        uses: Azure/setup-azd@80591774c092d5d640d43663766a76728d66e07d # v2.3.0

      - name: Configure azd authentication
        run: azd config set auth.useAzCliAuth true

      - name: Initialize azd environment
        env:
          AZURE_ENV_NAME: ${{ inputs.azure_env_name }}
          AZURE_LOCATION: ${{ inputs.azure_location }}
        run: |
          if ! azd env list | grep -q "$AZURE_ENV_NAME"; then
            azd env new "$AZURE_ENV_NAME" --location "$AZURE_LOCATION" --subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          else
            azd env select "$AZURE_ENV_NAME"
          fi

      - name: Preview provision
        env:
          AZURE_ENV_NAME: ${{ inputs.azure_env_name }}
          AZURE_LOCATION: ${{ inputs.azure_location }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_PRINCIPAL_ID: ${{ vars.AZURE_PRINCIPAL_ID }}
          AZURE_CONTAINERAPP_MIN_REPLICAS: ${{ vars.AZURE_CONTAINERAPP_MIN_REPLICAS }}
          AZURE_CONTAINERAPP_MAX_REPLICAS: ${{ vars.AZURE_CONTAINERAPP_MAX_REPLICAS }}
          AZURE_CONTAINERAPP_CONCURRENT_REQUESTS: ${{ vars.AZURE_CONTAINERAPP_CONCURRENT_REQUESTS }}
          AZURE_POSTGRES_SKU_NAME: ${{ vars.AZURE_POSTGRES_SKU_NAME }}
          AZURE_POSTGRES_SKU_TIER: ${{ vars.AZURE_POSTGRES_SKU_TIER }}
          AZURE_WEB_CUSTOM_DOMAIN: ${{ vars.AZURE_WEB_CUSTOM_DOMAIN }}
          AZURE_WEB_CERTIFICATE_NAME: ${{ vars.AZURE_WEB_CERTIFICATE_NAME }}
          AZURE_API_CUSTOM_DOMAIN: ${{ vars.AZURE_API_CUSTOM_DOMAIN }}
          AZURE_API_CERTIFICATE_NAME: ${{ vars.AZURE_API_CERTIFICATE_NAME }}
          AZD_AUTH_USE_AZURE_CLI: 'true'
        run: |
          set -euo pipefail
          azd provision --preview 2>&1 | tee azd-preview.txt

      - name: Add preview to job summary
        run: |
          {
            echo "## Infrastructure Preview"
            echo
            echo '```'
            cat azd-preview.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set artifact metadata
        id: meta
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: echo "artifact-name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: azd-preview.txt
          retention-days: 7