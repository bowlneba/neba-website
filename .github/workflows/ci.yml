name: CI Workflow

on:
  workflow_call:
    inputs:
      is_pull_request:
        description: "Whether this is running for a pull request"
        type: boolean
        required: true
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

  jest:
    name: JavaScript Tests (Jest)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Jest tests
        run: npm test -- --coverage

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-jest
          path: coverage/
          retention-days: 30

  xunit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write
    env:
      HUSKY: 0
    strategy:
      matrix:
        include:
          - test-project: tests/Neba.Website.Tests/Neba.Website.Tests.csproj
            test-name: Website Tests
            results-dir: TestResults-website
            needs-integration: false
            collect_coverage: true
          - test-project: tests/Neba.Api.Tests/Neba.Api.Tests.csproj
            test-name: API Tests
            results-dir: TestResults-api
            needs-integration: true
            collect_coverage: true
      fail-fast: false

    name: ${{ matrix.test-name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Pre-pull test container images
        if: matrix.needs-integration
        run: |
          docker pull postgres:17.6
          docker pull mcr.microsoft.com/azure-storage/azurite:latest

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build projects
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: |
          if [ "${{ matrix.collect_coverage }}" = "true" ]; then
            dotnet run --project ${{ matrix.test-project }} --configuration Release --no-build -- --coverage --coverage-output-format xml --coverage-output coverage.xml --report-trx --report-trx-filename results.trx --results-directory ${{ matrix.results-dir }}
          else
            dotnet run --project ${{ matrix.test-project }} --configuration Release --no-build -- --report-trx --report-trx-filename results.trx --results-directory ${{ matrix.results-dir }}
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.test-name }}
          path: "${{ matrix.results-dir }}/results.trx"
          retention-days: 30

      - name: Upload coverage reports
        if: always() && matrix.collect_coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.test-name }}
          path: "${{ matrix.results-dir }}/coverage.xml"
          retention-days: 30

  playwright:
    name: Playwright E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The image ships the browsers and their system libraries, so no apt install is needed.
    # Keep the tag and PLAYWRIGHT_VERSION equal to @playwright/test in package-lock.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    permissions:
      contents: read
    env:
      HUSKY: 0
      PLAYWRIGHT_VERSION: 1.63.0

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chrome
          - project: mobile-chrome
          - project: mobile-safari

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Build .NET projects
        run: dotnet build --configuration Release --no-restore

      - name: Install Node dependencies
        run: npm ci --ignore-scripts

      - name: Check Playwright image matches package-lock.json
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          if [ "$locked" != "$PLAYWRIGHT_VERSION" ]; then
            echo "::error::package-lock.json has @playwright/test $locked but the job container is v$PLAYWRIGHT_VERSION. Update the container tag and PLAYWRIGHT_VERSION in ci.yml."
            exit 1
          fi

      - name: Run Playwright tests
        run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  sonarcloud:
    if: github.actor != 'dependabot[bot]'
    needs: [xunit, jest, playwright]
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: ./.github/workflows/sonarcloud.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
