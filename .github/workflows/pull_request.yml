name: Pull Request Workflow

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
      - "Directory.Packages.props"
      - "package.json"
      - "package-lock.json"

jobs:
  format-check:
    name: Code Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

  ci:
    needs: format-check
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml
    with:
      is_pull_request: true
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  detect-apphost-changes:
    name: Detect AppHost changes
    runs-on: ubuntu-latest
    needs: format-check
    permissions:
      contents: read
    outputs:
      apphost_changed: ${{ steps.changes.outputs.apphost }}

    steps:
      - uses: actions/checkout@v7

      - name: Detect AppHost changes
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            apphost:
              - 'src/Neba.AppHost/AppHost.cs'

  azd-provision-preview:
    name: Infrastructure Preview
    if: needs.detect-apphost-changes.outputs.apphost_changed == 'true'
    needs: detect-apphost-changes
    uses: ./.github/workflows/infrastructure_preview.yml
    with:
      azure_env_name: bowlneba-prod
      azure_location: ${{ vars.AZURE_LOCATION }}
      artifact_name: pr-azd-preview
    permissions:
      contents: read
      id-token: write
      pull-requests: write

  comment-infra-preview:
    name: Comment preview on PR
    if: needs.detect-apphost-changes.outputs.apphost_changed == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs:
      - detect-apphost-changes
      - azd-provision-preview
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.azd-provision-preview.outputs.artifact-name }}
          path: /tmp

      - name: Comment preview on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          PREVIEW=$(cat /tmp/azd-preview.txt)
          BODY="<!-- azd-provision-preview -->
          ## Infrastructure Preview

          \`\`\`
          ${PREVIEW}
          \`\`\`"

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- azd-provision-preview -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

  outdated-packages:
    name: Outdated Packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    env:
      HUSKY: 0

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet-outdated
        run: dotnet tool install --global dotnet-outdated-tool

      - name: Check for outdated packages
        run: dotnet outdated Neba.Website.slnx --output-format json --output /tmp/outdated.json

      - name: Comment outdated packages on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          REPORT=$(jq -r '
            [.Projects[].TargetFrameworks[].Dependencies[]]
            | unique_by(.Name)
            | sort_by(.Name)
            | if length == 0 then empty
              else "| Package | Update | Severity |\n|---|---|---|\n"
                + (map("| \(.Name) | \(.ResolvedVersion) → \(.LatestVersion) | \(.UpgradeSeverity) |") | join("\n"))
              end' /tmp/outdated.json 2>/dev/null || true)

          if [ -z "$REPORT" ]; then
            REPORT="All NuGet packages are up to date."
          fi

          BODY="<!-- dotnet-outdated -->
          ## Outdated NuGet Packages

          ${REPORT}"

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- dotnet-outdated -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi

  outdated-npm-packages:
    name: Outdated npm Packages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Check for outdated packages
        run: npm outdated --json > /tmp/npm-outdated.json || true

      - name: Comment outdated npm packages on PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          REPORT=$(jq -r '
            to_entries
            | sort_by(.key)
            | if length == 0 then empty
              else "| Package | Current | Wanted | Latest |\n|---|---|---|---|\n"
                + (map("| \(.key) | \(.value.current // "-") | \(.value.wanted // "-") | \(.value.latest // "-") |") | join("\n"))
                + "\n\n_Wanted_ is the newest version `package.json` allows; _Latest_ may need a range bump."
              end' /tmp/npm-outdated.json 2>/dev/null || true)

          if [ -z "$REPORT" ]; then
            REPORT="All npm packages are up to date."
          fi

          BODY="<!-- npm-outdated -->
          ## Outdated npm Packages

          ${REPORT}"

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("<!-- npm-outdated -->")) | .id' | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body "$BODY"
          fi
