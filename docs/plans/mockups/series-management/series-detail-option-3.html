<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025 Vincent Hall Memorial Series - BowlNEBA (detail option 3)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .summary { display: flex; gap: 36px; flex-wrap: wrap; padding: 18px 22px; margin-bottom: 20px; }
  .summary div { display: grid; }
  .summary strong { font-family: var(--font-display); font-size: 22px; }
  .summary span { color: var(--muted); font-size: 13px; }

  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-strong);
    background: var(--surface-high);
  }
  tbody td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.kind-break td { border-top: 2px solid var(--border-strong); }
  td.order { font-family: var(--font-display); font-weight: 700; color: var(--muted); width: 48px; }
  td a { font-weight: 600; text-decoration: none; }
  td a:hover { text-decoration: underline; }
  .table-wrap { overflow: hidden; }

  /* Phone layout: mirrors neba-data-table (columns 1-3 primary, the rest expand on tap) */
  @media (max-width: 767px) {
    thead { display: none; }
    tbody tr { display: grid; grid-template-columns: 36px 1fr auto; padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; }
    tbody td { padding: 2px 4px; border: 0; }
    tbody td.extra { display: none; grid-column: 2 / -1; font-size: 14px; color: var(--muted); }
    tbody tr.open td.extra { display: block; }
    tbody tr.kind-break td { border-top: 0; }
  }
  .hero-actions { display: flex; gap: 8px; }
</style>
</head>
<body class="is-admin">
<div class="mock-switcher">
  <strong>Detail option 3: summary band and one data table</strong>
  <a href="series-detail-option-1.html">Option 1</a>
  <a href="series-detail-option-2.html">Option 2</a>
  <label><input type="checkbox" id="toggle-admin" checked> Signed in as admin</label>
  <label><input type="checkbox" id="toggle-locked"> Locked</label>
</div>

<nav class="site-nav"><div class="site-nav-inner">
  <a class="site-logo" href="#">NEBA</a>
  <div class="site-links"><span class="is-active">Tournaments <small>(Schedule · Series · Rules)</small></span><span>Stats</span><span>About</span><span>News</span><span>History</span></div>
</div></nav>

<header class="title-bar"><div class="title-bar-inner">
  <div>
    <h1 id="series-name"></h1>
    <p id="series-season"></p>
  </div>
  <div class="hero-actions admin-only flex">
    <a class="btn btn-on-blue" href="series-editor.html">Edit</a>
    <button class="btn btn-danger-on-blue" id="delete-btn" type="button" title="">Delete</button>
  </div>
</div></header>

<main class="page">
  <div class="panel summary">
    <div><strong id="q-slots"></strong><span>qualify at 8 events</span></div>
    <div><strong id="s-path"></strong><span>after the Survivor rounds</span></div>
    <div><strong id="finale"></strong><span>go to the Finale</span></div>
  </div>

  <div class="panel table-wrap">
    <table class="neba-data-table">
      <thead><tr><th>Stage</th><th>Tournament</th><th>Advancing</th><th>Kind</th><th>Dates</th><th>Squad</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="series-data.js"></script>
<script>
  const s = window.SERIES;
  document.getElementById('series-name').textContent = s.name;
  document.getElementById('series-season').textContent = s.season;
  const survivors = s.stages.filter(x => x.kind === 'Survivor');
  document.getElementById('q-slots').textContent = `Up to ${window.qualifyingSlots(s.stages)}`;
  document.getElementById('s-path').textContent = survivors.map(x => x.count).join(' → ');
  document.getElementById('finale').textContent = `Top ${s.stages.find(x => x.kind === 'Placement').count}`;

  const kindClass = { Qualifying: 'kind-qualifying', Survivor: 'kind-survivor', Placement: 'kind-placement' };
  document.getElementById('rows').innerHTML = s.stages.map((x, i) => `
    <tr class="${i > 0 && s.stages[i - 1].kind !== x.kind ? 'kind-break' : ''}">
      <td class="order">${i + 1}</td>
      <td><a href="#">${x.tournament}</a></td>
      <td>${window.advancingLabel(x)}</td>
      <td class="extra"><span class="kind-chip ${kindClass[x.kind]}">${x.kind}</span></td>
      <td class="extra">${x.dates}</td>
      <td class="extra">${x.squad ?? '—'}</td>
    </tr>`).join('');

  document.querySelectorAll('#rows tr').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.tagName !== 'A') tr.classList.toggle('open');
  }));

  window.wireAdminToggle();
  document.getElementById('toggle-locked').addEventListener('change', e => {
    const btn = document.getElementById('delete-btn');
    btn.disabled = e.target.checked;
    btn.title = e.target.checked ? "Processing has begun, so this Series can't be deleted." : '';
  });
</script>
</body>
</html>
