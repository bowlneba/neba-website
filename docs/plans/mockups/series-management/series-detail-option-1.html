<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2025 Vincent Hall Memorial Series - BowlNEBA (detail option 1)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  /* The narrowing field: the memorable element. Bar widths are proportional to the field size. */
  .funnel { padding: 24px 24px 20px; }
  .funnel h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 4px; }
  .funnel > p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .funnel-rows { display: grid; gap: 8px; }
  .funnel-row { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: center; }
  .funnel-label { font-size: 14px; font-weight: 600; }
  .funnel-label small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .bar {
    height: 34px;
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 18px;
    min-width: 54px;
  }
  .bar.q { background: var(--kind-qualifying); }
  .bar.s { background: var(--kind-survivor); }
  .bar.p { background: var(--neba-blue-brand); }
  @media (prefers-color-scheme: dark) { .bar.p { background: #3E4FD9; } }

  .section-title { font-family: var(--font-display); font-size: 18px; margin: 36px 0 12px; display: flex; gap: 10px; align-items: baseline; }
  .section-title span { font-family: var(--font-base); font-weight: 400; font-size: 14px; color: var(--muted); }

  .stage-list { list-style: none; margin: 0; padding: 0; }
  .stage-list li {
    display: grid;
    grid-template-columns: 36px 1fr 150px 180px;
    gap: 14px;
    align-items: center;
    padding: 14px 20px;
  }
  .stage-list li + li { border-top: 1px solid var(--border); }
  .order { font-family: var(--font-display); font-weight: 700; color: var(--muted); }
  .tname a { font-weight: 600; text-decoration: none; }
  .tname a:hover { text-decoration: underline; }
  .tname small { display: block; color: var(--muted); font-size: 13px; }
  .adv { font-weight: 600; }
  .squad { font-size: 14px; color: var(--muted); }

  .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .hero-id { display: flex; gap: 18px; align-items: center; }
  .hero-logo { position: relative; }
  .hero-logo .logo-tile { width: 88px; height: 88px; }
  .logo-edit { position: absolute; right: -8px; bottom: -8px; width: 30px; height: 30px; border-radius: 999px; border: 2px solid #fff; background: var(--neba-blue-600); color: #fff; cursor: pointer; font-size: 14px; }
  .funnel > p.funnel-caption { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
  .lock-note { display: none; color: rgba(255,255,255,.85); font-size: 13px; margin-top: 6px; }
  body.is-locked.is-admin .lock-note { display: block; }

  @media (max-width: 767px) {
    .funnel-row { grid-template-columns: 1fr; gap: 4px; }
    .stage-list li { grid-template-columns: 28px 1fr; }
    .stage-list .adv, .stage-list .squad { grid-column: 2; }
  }
</style>
</head>
<body class="is-admin">
<div class="mock-switcher">
  <strong>Detail option 1: the narrowing field, then Stages by kind</strong>
  <a href="series-detail-option-2.html">Option 2</a>
  <a href="series-detail-option-3.html">Option 3</a>
  <label><input type="checkbox" id="toggle-admin" checked> Signed in as admin</label>
  <label><input type="checkbox" id="toggle-locked"> Locked</label>
  <label><input type="checkbox" id="toggle-nofinale"> No Finale</label>
  <label><input type="checkbox" id="toggle-nologo"> No logo</label>
</div>

<nav class="site-nav"><div class="site-nav-inner">
  <a class="site-logo" href="#">NEBA</a>
  <div class="site-links"><span class="is-active">Tournaments <small>(Schedule · Series · Rules)</small></span><span>Stats</span><span>About</span><span>News</span><span>History</span></div>
</div></nav>

<header class="title-bar"><div class="title-bar-inner">
  <div class="hero-id">
    <div class="hero-logo">
      <span class="logo-tile" id="hero-logo"><img src="vincent-hall-logo.png" alt="2025 Vincent Hall Memorial Series logo"></span>
      <button type="button" class="logo-edit admin-only" aria-label="Edit logo for 2025 Vincent Hall Memorial Series" title="Opens the shared Edit logo modal">✎</button>
    </div>
    <div>
      <h1 id="series-name"></h1>
      <p id="series-season"></p>
    </div>
  </div>
  <div class="admin-only">
    <div class="hero-actions">
      <a class="btn btn-on-blue" href="series-editor.html">Edit</a>
      <button class="btn btn-danger-on-blue" id="delete-btn" type="button">Delete</button>
    </div>
    <p class="lock-note">Processing has begun, so this Series can't be deleted.</p>
  </div>
</div></header>

<main class="page">
  <section class="panel funnel" aria-labelledby="funnel-title">
    <h2 id="funnel-title">How the field narrows</h2>
    <p id="funnel-intro"></p>
    <div class="funnel-rows" id="funnel"></div>
    <p class="funnel-caption" id="funnel-caption" hidden>No Finale: the Placement Round sets the final standings.</p>
  </section>

  <div id="groups"></div>
</main>

<script src="series-data.js"></script>
<script>
  const s = window.SERIES;
  document.getElementById('series-name').textContent = s.name;
  document.getElementById('series-season').textContent = s.season;

  function render() {
  const max = window.qualifyingSlots(s.stages);
  const survivors = s.stages.filter(x => x.kind === 'Survivor');
  const finale = s.finale;
  const rows = [
    { label: 'Qualifiers', sub: `${s.stages.filter(x => x.kind === 'Qualifying').length} events, top finishers`, n: max, cls: 'q', prefix: 'Up to ' },
    ...survivors.map(x => ({ label: x.tournament, sub: `Survivor · ${x.dates}`, n: x.count, cls: 's' })),
    ...(finale ? [{ label: 'Finale', sub: finale.when, n: finale.count, cls: 'p' }] : []),
  ];
  document.getElementById('funnel-intro').textContent = finale
    ? 'Bowlers qualify at the early events, are cut by squad score, and the last round decides the Finale.'
    : 'Bowlers qualify at the early events, are cut by squad score, and the last round decides the final standings.';
  document.getElementById('funnel-caption').hidden = !!finale;
  document.getElementById('funnel').innerHTML = rows.map(r => `
    <div class="funnel-row">
      <div class="funnel-label">${r.label}<small>${r.sub}</small></div>
      <div class="bar ${r.cls}" style="width:${Math.max(8, r.n / max * 100)}%">${r.prefix ?? ''}${r.n}</div>
    </div>`).join('');

  const groups = [
    ['Qualifying', 'Qualifying events', 'Top finishers enter the Series'],
    ['Survivor', 'Survivor rounds', 'Cut by the designated squad score'],
    ['Placement', 'Placement round', 'Ranked by tournament position'],
  ];
  document.getElementById('groups').innerHTML = groups.map(([kind, title, note]) => {
    const items = s.stages.map((x, i) => ({ ...x, order: i + 1 })).filter(x => x.kind === kind);
    return `
      <h2 class="section-title">${title} <span>${note}</span></h2>
      <ol class="panel stage-list">
        ${items.map(x => `
          <li>
            <span class="order">${x.order}</span>
            <span class="tname"><a href="#">${x.tournament}</a><small>${x.dates}${x.teamSize > 1 ? ` · ${x.teamSize}-bowler teams` : ''}</small></span>
            <span class="adv">${window.advancingLabel(x)}</span>
            <span class="squad">${x.squad ?? ''}</span>
          </li>`).join('')}
      </ol>`;
  }).join('') + (finale ? `
      <h2 class="section-title">Finale <span>Top ${finale.count} of the Placement Round</span></h2>
      <div class="panel" style="padding:16px 20px;display:flex;gap:28px;flex-wrap:wrap">
        <span style="font-weight:600">${finale.when}</span>
        <span>${finale.host ?? 'Host center to be announced'}</span>
      </div>` : '');
  }
  const finale0 = s.finale;
  render();

  document.getElementById('toggle-nofinale').addEventListener('change', e => {
    s.finale = e.target.checked ? null : finale0;
    render();
  });
  document.getElementById('toggle-nologo').addEventListener('change', e => {
    const tile = document.getElementById('hero-logo');
    tile.className = e.target.checked ? 'logo-tile logo-tile--large logo-tile--initials' : 'logo-tile';
    tile.innerHTML = e.target.checked ? 'VH' : '<img src="vincent-hall-logo.png" alt="2025 Vincent Hall Memorial Series logo">';
  });

  window.wireAdminToggle();
  document.getElementById('toggle-locked').addEventListener('change', e => {
    document.getElementById('delete-btn').disabled = e.target.checked;
  });
</script>
</body>
</html>
